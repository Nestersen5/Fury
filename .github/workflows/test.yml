name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Node 24.20.0 crashes in Windows fs.watch on 8.3 paths (nodejs/node#65118).
        node: [22.x, 24.21.0]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:compatibility && npm test
        env:
          STATMOD_JWT_SECRET: ci-test-secret-not-used-for-anything-real
          STATMOD_ADMIN_PASSWORD: ci-test-admin-password

      - name: Run Windows integration tests
        if: matrix.os == 'windows-latest' && matrix.node == '22.x'
        run: npm run test:integration
        env:
          STATMOD_JWT_SECRET: ci-test-secret-not-used-for-anything-real
          STATMOD_ADMIN_PASSWORD: ci-test-admin-password
