name: Fury macOS distributions

on:
  workflow_dispatch:
  push:
    branches: ['portable/macos-*']

permissions:
  contents: read

jobs:
  package:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      FURY_SKIP_REAL_AUTH_TEST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Install build dependencies
        run: npm ci --no-audit --no-fund
      - name: Require native architecture for runtime acceptance
        run: node -e "if (process.platform !== 'darwin' || process.arch !== '${{ matrix.arch }}') throw new Error('Native target architecture required')"
      - name: Run feature and portability tests
        run: npm run test:compatibility && npm test && npm run test:portable && npm run test:packaging && node scripts/verify_additional_features.js
      - name: Verify publication fixtures and protected shutdown/history ownership
        run: npm run test:integration
      - name: Package and compare ZIP and DMG from the shared app
        id: build_app
        run: |
          npm run package:mac -- --arch ${{ matrix.arch }}
          git rev-parse HEAD > release/mac-portable/SOURCE-COMMIT.txt
      # Retain the verified containers before UI acceptance. A later test
      # failure must not discard the binaries needed to reproduce that failure.
      # Short retention only affects NEW artifacts; it does not clear old quota.
      - name: Retain private native containers
        id: retain_containers
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Fury-mac-${{ matrix.arch }}
          path: |
            release/mac-portable/Fury-Portable-*-mac-${{ matrix.arch }}.zip
            release/mac-portable/Fury-*-mac-${{ matrix.arch }}.dmg
            release/mac-portable/PAIR-mac-${{ matrix.arch }}.json
            release/mac-portable/release-metadata.json
            release/mac-portable/SOURCE-COMMIT.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Verify extracted download
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/Fury extracted"
          ditto -x -k release/mac-portable/Fury-Portable-*-mac-${{ matrix.arch }}.zip "$RUNNER_TEMP/Fury extracted"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/Fury extracted/Fury.app"
          node scripts/smoke_packaged_app.js "$RUNNER_TEMP/Fury extracted/Fury.app"
          node scripts/verify_packaged_runtime.js "$RUNNER_TEMP/Fury extracted/Fury.app" "release/mac-portable/ZIP-RUNTIME-${{ matrix.arch }}.json"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/Fury extracted/Fury.app"
      - name: Mount DMG, copy app, and verify native runtime without changing bundle
        run: node scripts/verify_macos_dmg.js release/mac-portable ${{ matrix.arch }} "$RUNNER_TEMP/Fury extracted/Fury.app"
      - name: Verify current source and every launcher page in the extracted app
        shell: bash
        run: |
          node scripts/verify_packaged_sources.js "$RUNNER_TEMP/Fury extracted/Fury.app" "release/mac-portable/SOURCE-VERIFICATION-${{ matrix.arch }}.json"
          node scripts/verify_launcher_redesign.js --app "$RUNNER_TEMP/Fury extracted/Fury.app" --output "output/mac-${{ matrix.arch }}-verification"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/Fury extracted/Fury.app"
      - name: Verify onboarding, accounts, profiles, settings and calendar stats in the extracted app
        if: ${{ !cancelled() && steps.build_app.outcome == 'success' }}
        run: node scripts/verify_launcher_focused.js --app "$RUNNER_TEMP/Fury extracted/Fury.app" --output "output/mac-${{ matrix.arch }}-focused"
      - name: Capture the current app on macOS
        if: ${{ !cancelled() && steps.build_app.outcome == 'success' }}
        run: node scripts/capture_macos_app.js "$RUNNER_TEMP/Fury extracted/Fury.app" "output/mac-${{ matrix.arch }}-screenshots"
      - name: Add instructions and checksums
        shell: bash
        run: |
          cp docs/PORTABLE_MAC.md release/mac-portable/READ-ME-MAC.txt
          cd release/mac-portable
          shasum -a 256 Fury-Portable-*-mac-${{ matrix.arch }}.zip Fury-*-mac-${{ matrix.arch }}.dmg > SHA256-${{ matrix.arch }}.txt
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.build_app.outcome == 'success' }}
        with:
          name: Fury-mac-${{ matrix.arch }}-acceptance
          path: |
            release/mac-portable/PAIR-mac-${{ matrix.arch }}.json
            release/mac-portable/DESKTOP-${{ matrix.arch }}.json
            release/mac-portable/DMG-RUNTIME-${{ matrix.arch }}.json
            release/mac-portable/ZIP-RUNTIME-${{ matrix.arch }}.json
            release/mac-portable/release-metadata.json
            release/mac-portable/READ-ME-MAC.txt
            release/mac-portable/SHA256-${{ matrix.arch }}.txt
            release/mac-portable/SOURCE-VERIFICATION-${{ matrix.arch }}.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Fury-mac-${{ matrix.arch }}-ui-verification
          path: output/mac-${{ matrix.arch }}-*/
          if-no-files-found: warn
          retention-days: 3
      - name: Require container retention
        if: ${{ always() && steps.build_app.outcome == 'success' }}
        env:
          RETENTION_OUTCOME: ${{ steps.retain_containers.outcome }}
        run: |
          if [ "$RETENTION_OUTCOME" != success ]; then
            echo '::error::Mac containers were NOT retained. If artifact quota is exhausted, the account owner must free storage or resolve the quota and wait for GitHub usage recalculation before rerunning. No existing artifacts are deleted by this workflow.'
            exit 1
          fi
      - name: Record acceptance reports in private job log
        if: always()
        shell: bash
        run: |
          for file in release/mac-portable/SOURCE-COMMIT.txt release/mac-portable/PAIR-mac-${{ matrix.arch }}.json release/mac-portable/release-metadata.json release/mac-portable/ZIP-RUNTIME-${{ matrix.arch }}.json release/mac-portable/DMG-RUNTIME-${{ matrix.arch }}.json release/mac-portable/DESKTOP-${{ matrix.arch }}.json; do
            if [ -f "$file" ]; then printf '\nACCEPTANCE %s\n' "$file"; cat "$file"; fi
          done
